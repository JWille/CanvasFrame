<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanvasFrame</title>
<!--
  CanvasFrame home screen for LG webOS. Mirrors the Android launcher (launcher/.../HomeActivity.java):
  clock + calendar panel, weather card + forecast/radar panel, Inputs/Apps drawers, photo rotation,
  readability shading, idle auto-hide (controls slide off the edges), Frame/Glass themes, and the same two-column
  remote navigation.
  Laid out in the Android app's 960×540 dp space and zoomed to the screen.
-->
<style>
  :root { --text: #f6f1ea; --muted: rgba(246,241,234,.62); --accent: #e8c99a; --on-accent: #2b2218; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1b18; cursor: none; }
  body { font-family: "LG Smart UI", "Museo Sans", Roboto, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 960px; height: 540px; overflow: hidden;
    background: linear-gradient(135deg, #1e1b18, #3a3129 55%, #5e4e3d); }
  .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s; }
  .ph.on { opacity: 1; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,.6)); }
  #readScrim { position: absolute; inset: 0; opacity: 0; transition: opacity .5s;
    background: linear-gradient(to right, rgba(0,0,0,.7), rgba(0,0,0,.45) 25%, rgba(0,0,0,.15) 50%, rgba(0,0,0,0) 75%); }
  .sh { text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  body.strong .sh { text-shadow: 0 2px 10px rgba(0,0,0,.85); }

  /* ---- left column: clock + weather */
  #left { position: absolute; left: 26px; top: 20px; width: 260px; transition: transform .32s cubic-bezier(.2,.8,.3,1), opacity .32s; }
  /* Idle: the clock/weather column slides off the left edge and the INPUTS/APPS buttons off the right (as on Android). */
  body.ctlout #left { transform: translateX(-320px); opacity: 0; transition: transform .26s cubic-bezier(.6,0,.9,.6), opacity .26s; }
  body.ctlout .toggle { transform: translateX(150px); transition: opacity .16s, transform .26s cubic-bezier(.6,0,.9,.6); }
  body.ctlout #readScrim { opacity: 0 !important; }
  .card { display: flex; align-items: center; border-radius: 14px; border: 2px solid transparent; transition: background .15s, border-color .15s; }
  .card.focus { background: linear-gradient(135deg, rgba(28,31,36,.45), rgba(32,58,68,.45), rgba(24,42,51,.45)); border-color: var(--accent); }
  .expand { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 16px; line-height: 18px;
    text-align: center; margin-left: 10px; opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; flex: none; }
  .card.focus .expand { opacity: 1; transform: none; }
  #clockCard { padding: 2px 8px 6px 10px; display: inline-flex; }
  #clock { font-family: "Museo Sans", "LG Smart UI"; font-weight: 100; font-size: 56px; line-height: 1; letter-spacing: -.5px; }
  body.glass #clock { font-size: 64px; letter-spacing: -1.5px; }
  #date { font-weight: 300; font-size: 16px; color: rgba(255,255,255,.87); margin-top: 2px; }
  #nextEvent { font-weight: 300; font-size: 11px; padding: 4px 0 0 2px; white-space: nowrap; }
  #dashHint { font-size: 9px; color: var(--muted); letter-spacing: .4px; padding: 6px 0 0 2px; }
  #weatherCard { width: 170px; margin-top: 10px; padding: 8px 8px 9px 12px; }
  #weatherCard .content { flex: 1; min-width: 0; }
  #wHead { display: flex; align-items: center; }
  #wIcon { font-size: 20px; }
  #wTemp { font-family: "Museo Sans"; font-weight: 100; font-size: 28px; padding-left: 6px; line-height: 1; }
  #wCond { font-size: 10px; font-weight: 300; }
  #wRange { font-size: 7px; font-weight: 300; color: rgba(255,255,255,.87); }
  #wRule { height: 1px; background: rgba(255,255,255,.2); margin: 6px 0 5px; }
  #wPlace { font-size: 8px; font-weight: 300; }
  #wUpdated { font-size: 7px; font-weight: 300; color: rgba(255,255,255,.7); }
  .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- drawers */
  .rowwrap { position: absolute; overflow: hidden; transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .28s; }
  .rowwrap.out { transform: translateX(960px); opacity: 0; transition: transform .22s cubic-bezier(.6,0,.9,.6), opacity .22s; }
  #inWrap { top: 22px; right: 20px; max-width: 640px; padding: 0 0 26px 24px; }
  #apWrap { left: 14px; right: 0; bottom: 8px; padding: 30px 0 0 12px; }
  .label { font-size: 8px; letter-spacing: 1.3px; color: var(--muted); padding: 4px 0 1px 6px; text-transform: uppercase; }
  body.glass .label { display: none; }
  .row { display: flex; padding: 4px 24px 4px 6px; transition: transform .2s; white-space: nowrap; }
  body.glass .row { background: linear-gradient(to bottom, rgba(255,255,255,.35), rgba(255,255,255,.18), rgba(255,255,255,.25));
    border: 1px solid rgba(255,255,255,.5); border-radius: 24px; padding: 10px 1px 10px 12px; }
  #inRow { justify-content: flex-end; }
  /* The apps tray grows with its tiles and always runs off the right edge of the screen (as on Android), instead of
     stopping at the screen width while the tiles carry on past it. */
  #apRow { width: max-content; min-width: calc(100% + 40px); box-sizing: border-box; }
  body.glass #apRow { padding-right: 60px; }

  .tile { flex: none; margin: 4px 11px 4px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.18); opacity: .55; transition: transform .15s, opacity .15s, background .15s, border-color .15s; }
  body.bright .tile { background: rgba(20,18,16,.6); border-color: rgba(255,255,255,.25); opacity: .88; }
  .tile.nosig { opacity: .35; }
  body.bright .tile.nosig { opacity: .65; }
  .tile.focus { opacity: 1 !important; border: 2px solid var(--accent); }
  .tile.text.focus { background: var(--accent) !important; color: var(--on-accent); }
  .tile.text.focus .sub { color: rgba(43,34,24,.7); }
  .tile.in { width: 104px; height: 46px; transform-origin: 50% 0; }
  .tile.in.focus { transform: scale(1.18); }
  .tile.ap { width: 96px; height: 54px; transform-origin: 50% 100%; }
  .tile.ap.focus { transform: scale(1.18); }
  .tile.text { display: flex; flex-direction: column; justify-content: center; padding: 4px 8px 4px 10px; }
  .tile .t { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { font-size: 8px; color: var(--muted); }
  .tile.icon { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tile.icon img { width: 22px; height: 22px; border-radius: 5px; object-fit: contain; }
  .tile.icon .sym { font-size: 18px; line-height: 22px; }
  body.glass .tile.icon .sym { font-size: 24px; line-height: 30px; }
  .tile.icon .t { font-size: 8px; padding: 3px 4px 0; max-width: 100%; }
  body.glass .tile { background: linear-gradient(to bottom, rgba(72,72,80,.7), rgba(46,46,52,.7), rgba(36,36,40,.7));
    border: 1px solid rgba(255,255,255,.3); border-radius: 14px; opacity: .94; }
  body.glass .tile.focus { background: linear-gradient(to bottom, rgba(104,104,114,.9), rgba(72,72,80,.9), rgba(58,58,66,.9)) !important;
    border: 2px solid rgba(255,255,255,.95); color: var(--text); }
  body.glass .tile.text.focus .sub { color: var(--muted); }
  body.glass .tile.ap { width: 84px; height: 70px; }
  body.glass .tile.focus { transform: scale(1.12); }
  body.glass .tile.icon img { width: 30px; height: 30px; border-radius: 7px; }
  body.glass .tile.icon .t { font-size: 9px; padding-top: 5px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  body.glass .tile.text { align-items: center; }

  .toggle { position: absolute; display: flex; align-items: center; justify-content: center; width: 104px; height: 46px;
    font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; transition: opacity .16s, transform .32s cubic-bezier(.2,.8,.3,1); }
  .toggle.hide { opacity: 0 !important; pointer-events: none; }
  body.glass .toggle { border-radius: 99px; letter-spacing: .4px; text-transform: none; font-size: 11px; height: 40px; }
  #inToggle { top: 30px; right: 20px; margin: 0; }
  #apToggle { bottom: 18px; right: 20px; height: 54px; margin: 0; }
  body.glass #apToggle { height: 40px; }

  /* ---- centre panels */
  .panel { position: absolute; left: 216px; width: 560px; padding: 14px 14px 14px 18px; border-radius: 20px; display: none;
    background: linear-gradient(135deg, rgba(18,24,32,.6), rgba(24,42,54,.6), rgba(16,24,32,.6)); border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 8px 24px rgba(0,0,0,.35); opacity: 0; transform: translateX(-12px); transition: opacity .18s, transform .18s; }
  .panel.open { display: flex; }
  .panel.shown { opacity: 1; transform: none; }
  #forecast { top: 112px; }
  #calendar { top: 40px; }
  .pleft { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; align-items: center; }
  .tab { font-size: 14px; padding: 4px 10px; border-radius: 10px; color: var(--muted); }
  .tab.active { background: rgba(255,255,255,.15); color: var(--text); }
  .tab.focus { background: var(--accent); color: var(--on-accent); }
  .slash { color: var(--muted); font-size: 13px; font-weight: 300; padding: 0 2px; }
  #pills { display: flex; margin-top: 10px; }
  .pill { flex: 1; margin-right: 6px; padding: 7px 0; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    display: flex; flex-direction: column; align-items: center; }
  .pill .a { font-size: 9px; } .pill .b { font-size: 18px; padding: 4px 0; } .pill .c { font-size: 11px; } .pill .l { font-size: 9px; color: var(--muted); }
  #tomorrow { margin-top: 12px; padding: 8px 14px; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    display: flex; align-items: center; }
  #tomorrow .tl b { display: block; font-size: 11px; font-weight: 400; } #tomorrow .tl span { font-size: 9px; color: var(--muted); }
  #tmTemp { flex: 1; font-size: 26px; font-weight: 300; padding-left: 14px; } #tmIcon { font-size: 28px; }
  #sun { width: 132px; margin-left: 14px; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2);
    display: flex; flex-direction: column; justify-content: center; }
  #sun .k { font-size: 10px; color: var(--muted); padding-top: 6px; }
  #sun .v { font-size: 20px; } #sun .v small { font-size: 10px; color: var(--muted); padding-left: 5px; }
  #dayLen { font-size: 17px; }
  #radar { margin-top: 10px; position: relative; display: none; }
  #radar canvas { width: 100%; display: block; border-radius: 12px; }
  #radarMsg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 11px; color: var(--muted); }
  body.radar #pills, body.radar #tomorrow, body.radar #sun { display: none; }
  body.radar #radar { display: block; }

  #calTitle { font-size: 14px; padding: 4px 10px; border-radius: 10px; background: rgba(255,255,255,.15); }
  #calTitle.focus { background: var(--accent); color: var(--on-accent); }
  .calhead { display: flex; align-items: center; }
  .calhead span { font-size: 9px; color: var(--muted); padding-left: 8px; }
  #calGrid { margin-top: 8px; }
  .cr { display: flex; }
  .cc { flex: 1; height: 28px; display: flex; flex-direction: column; align-items: center; }
  .cc b { width: 20px; height: 20px; line-height: 20px; text-align: center; font-size: 11px; font-weight: 400; border-radius: 50%; }
  .cc.dn b { font-size: 9px; color: var(--muted); }
  .cc.today b { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .cc i { width: 4px; height: 4px; border-radius: 50%; margin-top: 1px; }
  #agenda { width: 210px; margin-left: 14px; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2); align-self: flex-start; }
  #agenda .h { font-size: 10px; color: var(--muted); letter-spacing: 1.4px; }
  #agenda .d { font-size: 9px; color: var(--accent); padding: 7px 0 1px; font-weight: 600; }
  #agenda .e { font-size: 10px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  #agenda .e i { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-right: 6px; }
  #agenda .none { font-size: 10px; color: var(--muted); padding-top: 8px; white-space: pre-line; }

  #toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); padding: 6px 14px; border-radius: 10px; font-size: 11px;
    background: rgba(20,17,14,.9); border: 1px solid rgba(255,255,255,.15); opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #toast.notice { font-size: 15px; padding: 10px 20px; border-radius: 14px; }
  #toast { z-index: 1000; color: #fff; }
</style>
</head>
<body class="ctlout">
<div id="stage">
  <img class="ph" id="phA" alt=""><img class="ph" id="phB" alt="">
  <div class="scrim"></div>
  <div id="readScrim"></div>

  <div id="left">
    <div class="card" id="clockCard">
      <div>
        <div id="clock" class="sh">--:--</div>
        <div id="date" class="sh"></div>
        <div id="nextEvent" class="sh" hidden></div>
        <div id="dashHint" class="sh"></div>
      </div>
      <div class="expand">›</div>
    </div>
    <div class="card" id="weatherCard">
      <div class="content">
        <div id="wHead"><span id="wIcon" class="sh">🌤️</span><span id="wTemp" class="sh">--°</span></div>
        <div id="wCond" class="sh line"></div>
        <div id="wRange" class="sh line"></div>
        <div id="wRule"></div>
        <div id="wPlace" class="sh line"></div>
        <div id="wUpdated" class="sh line"></div>
      </div>
      <div class="expand">›</div>
    </div>
  </div>

  <div class="rowwrap out" id="inWrap"><div class="label sh">Inputs</div><div class="row" id="inRow"></div></div>
  <div class="tile text toggle" id="inToggle">Inputs</div>
  <div class="rowwrap out" id="apWrap"><div class="label sh">Apps</div><div class="row" id="apRow"></div></div>
  <div class="tile text toggle" id="apToggle">Apps</div>

  <div class="panel" id="forecast">
    <div class="pleft">
      <div class="tabs"><span class="tab" data-tab="0">Hourly</span><span class="slash">/</span><span class="tab" data-tab="1">Weekly</span><span class="slash">/</span><span class="tab" data-tab="2">Radar</span></div>
      <div id="radar"><canvas id="radarCanvas" width="768" height="400"></canvas><div id="radarMsg"></div></div>
      <div id="pills"></div>
      <div id="tomorrow"><div class="tl"><b>Tomorrow</b><span id="tmCond"></span></div><div id="tmTemp"></div><div id="tmIcon"></div></div>
    </div>
    <div id="sun">
      <div class="k">Sunrise</div><div class="v" id="sunrise"></div>
      <div class="k">Sunset</div><div class="v" id="sunset"></div>
      <div class="k">Length of day</div><div id="dayLen"></div>
    </div>
  </div>

  <div class="panel" id="calendar">
    <div class="pleft">
      <div class="calhead"><div id="calTitle"></div><span>◀ ▶ change month</span></div>
      <div id="calGrid"></div>
    </div>
    <div id="agenda"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const DAY = 86400000;
const WMO = {0:['☀️','Clear','🌙'],1:['🌤️','Mostly clear','🌙'],2:['⛅','Partly cloudy','☁️'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Fog'],
  51:['🌦️','Drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Drizzle'],56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],
  61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],
  71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌦️','Showers'],
  82:['⛈️','Violent showers'],85:['🌨️','Snow showers'],86:['🌨️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Storm with hail'],99:['⛈️','Storm with hail']};
const desc = (code, day) => { const d = WMO[code] || ['🌡️', '—']; return [!day && d[2] ? d[2] : d[0], d[1]]; };
const deg = t => Math.round(t) + '°';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fit() { document.body.style.zoom = window.innerWidth / 960; }
window.addEventListener('resize', fit); fit();

let data = null, S = {};
const api = (p, body) => fetch('/api/' + p, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CanvasFrame': '1' }, body: JSON.stringify(body) })
  .then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || r.statusText); return j; }));
let toastT;
function toast(m, ms) {
  const t = $('#toast'); t.textContent = m; t.classList.toggle('notice', !!ms); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2200);
}
// Messages sent with "open the home screen" (e.g. sync from another TV); only fresh ones, once each.
let noticeId = '';
function showNotice(n) {
  if (!n || n.id === noticeId) return;
  noticeId = n.id;
  if (n.age < 20000) toast(n.text, 6000);
}

// ================================================================ clock
const h24 = () => S.clock === '24';
const fmtTime = (d, ampm) => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: !h24() }).replace(ampm ? /^$/ : /\s?[AP]M$/i, '');
function tickClock() {
  const d = new Date();
  $('#clock').textContent = fmtTime(d, false);
  $('#date').textContent = h24() ? d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })
                                 : d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
setInterval(tickClock, 1000);

// ================================================================ render data
function render() {
  S = data.settings;
  document.body.classList.toggle('glass', S.theme === 'glass');
  $('#dashHint').textContent = 'Dashboard  ' + data.dash;
  $('#dashHint').hidden = !S.show_dash;
  tickClock();
  renderWeather();
  renderCalendar();
  renderRows();
  renderPhoto();
  if ($('#forecast').classList.contains('open')) renderForecast();
  // "Always show controls" changed in the dashboard: apply it now.
  if (S.controls_always !== prevAlways) {
    if (prevAlways !== undefined) { if (ctlAlways()) slideControls(true); else if (parked) slideControls(false); }
    prevAlways = S.controls_always;
  }
}

function renderWeather() {
  const card = $('#weatherCard');
  card.hidden = !S.weather_on;
  card.style.display = S.weather_on ? '' : 'none';
  const w = data.weather;
  if (!S.weather_place || !w || !w.current) {
    $('#wIcon').textContent = '🌤️'; $('#wTemp').textContent = '--°';
    $('#wCond').textContent = S.weather_place ? 'Loading…' : 'Set a location';
    $('#wRange').textContent = S.weather_place ? '' : 'Dashboard › Home screen';
    $('#wPlace').textContent = S.weather_place ? S.weather_place : ''; $('#wUpdated').textContent = '';
    return;
  }
  const c = w.current, d = desc(c.weather_code, c.is_day !== 0);
  $('#wIcon').textContent = d[0];
  $('#wTemp').textContent = deg(c.temperature_2m) + (w.unit || 'F');
  $('#wCond').textContent = d[1];
  $('#wRange').textContent = `H ${deg(w.daily.temperature_2m_max[0])}  ·  L ${deg(w.daily.temperature_2m_min[0])}  ·  Feels ${deg(c.apparent_temperature)}`;
  $('#wPlace').textContent = S.weather_place;
  $('#wUpdated').textContent = 'Updated ' + fmtTime(new Date(w.fetched), true);
}

// ---------------------------------------------------------------- calendar
let monthOffset = 0;
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
function dayLabel(t) {
  const today = startOfToday();
  if (t < today + DAY) return 'Today';
  if (t < today + 2 * DAY) return 'Tomorrow';
  return new Date(t).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
const upcoming = ev => { const now = Date.now(); return ev.a ? ev.s + DAY > now : Math.max(ev.e, ev.s) > now; };
function renderCalendar() {
  const evs = data.events;
  let line = null;
  if (evs) {
    const now = Date.now();
    const ev = evs.find(upcoming);
    if (ev && ev.s <= now + 7 * DAY) {
      let when = ev.a ? dayLabel(Math.max(ev.s, now)) : dayLabel(ev.s) + ' ' + fmtTime(new Date(ev.s), true);
      if (ev.s <= now && !ev.a) when = 'Now';
      line = '📅 ' + when + ' · ' + ev.t;
    }
  }
  $('#nextEvent').textContent = line || '';
  $('#nextEvent').hidden = !line;
  renderMonth();
}
function renderMonth() {
  const today = new Date(), month = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  $('#calTitle').textContent = month.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const dots = {};
  for (const ev of (data && data.events) || []) {
    const s = new Date(ev.s), end = Math.max(ev.e, ev.s + 1) - 1;
    while (s.getTime() <= end) {

const radar = (() => {
  const Z = 7, T = 256, W = 768, H = 400, FRAME_MS = 550, HOLD_MS = 1600;
  const cv = $('#radarCanvas'), ctx = cv.getContext('2d');

  const img = src => new Promise(res => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

      for (let tx = Math.floor(left / T); tx <= Math.floor((left + W) / T); tx++) {

        const x = ((tx % max) + max) % max;
        jobs.push(img(urlFor(x, ty)).then(i => { if (i) { if (filter) g.filter = filter; g.drawImage(i, tx * T - left, ty * T - top); } }));

    const n = 1 << Z, lat = w.latitude * Math.PI / 180;
    const cx = (w.longitude + 180) / 360 * n * T, cy = (1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * n * T;

    msg(frames.length ? '' : 'Loading radar frames…');

      const maps = await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
      const past = maps.radar.past || [], now = maps.radar.nowcast || [], all = past.concat(now);
      const fr = await Promise.all(all.map(f => compose(left, top, (x, y) => `${maps.host}${f.path}/${T}/${Z}/${x}/${y}/2/1_1.png`)));

      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(12, H - 44, 150, 32);
      ctx.fillStyle = '#f6f1ea'; ctx.font = '20px "LG Smart UI", sans-serif';
      ctx.fillText((idx >= pastN ? 'Forecast ' : '') + t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: !h24() }), 22, H - 21);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(12, H - 8, W - 24, 4);

    }

    ctx.beginPath(); ctx.arc(W / 2, H / 2, 6, 0, 7); ctx.fillStyle = '#e8c99a'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#2b2218'; ctx.stroke();
  }

    if (!running) return;
    let delay = FRAME_MS;

    start() { if (running) return; running = true; if (Date.now() - loadedAt > 600000) load(); else draw(); clearTimeout(timer); timer = setTimeout(loop, FRAME_MS); },
    stop() { running = false; clearTimeout(timer); },
    showing: () => running,
  };
})();

// ---- idle auto-hide

let idleSince = Date.now(), dimT = null;

let okDown = 0, swallowOk = false;
document.addEventListener('keydown', e => {
  if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) { e.preventDefault(); goIdle(); return; }
  const k = KEYMAP[e.keyCode];
  // webOS 7 shows LG's home as a layer over the app in front (this one), so the app list never changes and only
  // this key (1536) reaches the page: ask the server to bring CanvasFrame back over LG's home.
  if (e.keyCode === 1536) { api('home/reopen', {}).catch(() => {}); return; }
  // Input button: open the Inputs row (the server also closes LG's input menu if it opened).
  if (e.keyCode === 1537) { e.preventDefault(); openInputs(); return; }
  if (!k) { api('home/log', { m: 'unhandled key ' + e.keyCode + ' ' + e.key }).catch(() => {}); return; }
  e.preventDefault();
  if (e.repeat && k === 'ok') return;
  if (parked) { if (!e.repeat) { wake(k); scheduleIdle(); if (k === 'ok') swallowOk = true; } return; }
  scheduleIdle();
  if (k === 'ok') { okDown = Date.now(); return; }   // acted on at keyup (hold = hide app)
  moveWithSound(k);
});
document.addEventListener('keyup', e => {
  if (KEYMAP[e.keyCode] !== 'ok' || parked) return;
  if (swallowOk) { swallowOk = false; return; }
  if (!okDown || !focus) return;
  const heldMs = Date.now() - okDown;
  okDown = 0;
  moveWithSound(heldMs > 700 && focus.kind === 'ap' ? 'hold' : 'ok');
});

// ================================================================ data loop
let version = 0;
function load() {
  return api('home').then(d => { data = d; version = d.version; render(); }).catch(() => {});
}
// If the server stops answering (it moved port after a takeover/restore), find it on the other port.
let misses = 0, build = null;
function findServer() {
  const ports = [8080, 8081].filter(p => String(p) !== location.port);
  ports.forEach(p => fetch(`http://127.0.0.1:${p}/api/home/ver`).then(r => r.json()).then(j => {
    if (j && 'version' in j) location.replace(`http://127.0.0.1:${p}/home`);
  }).catch(() => {}));
}
setInterval(() => {
  if (document.hidden) return;
  api('home/ver').then(v => {
    misses = 0;
    if (build && v.build && v.build !== build) { location.reload(); return; }   // server restarted with new code
    build = v.build;
    if (v.version !== version) load();
    showNotice(v.notice);
  })
    .catch(() => { if (++misses >= 3) findServer(); });
}, 4000);
setInterval(() => { if (!document.hidden) load(); }, 60000);   // inputs connecting, clock-driven tags
document.addEventListener('visibilitychange', () => { if (!document.hidden) { reset(); load(); } });
// The app declares handlesRelaunch, so a relaunch (Home button, stock-home takeover) only sends this event:
// the app has to bring its own window to the front.
/** Show the Inputs row with the first input selected (Input button, or a launch asking for it). */
function openInputs() {
  if (!inTiles.length) return;
  slideControls(true);
  parked = false;
  go({ kind: 'in', i: 0 });
  scheduleIdle();
}
function launchParams() {
  try { const p = window.PalmSystem && PalmSystem.launchParams; return typeof p === 'string' ? JSON.parse(p || '{}') : (p || {}); } catch (e) { return {}; }
}
document.addEventListener('webOSRelaunch', e => {
  try { if (window.PalmSystem && PalmSystem.activate) PalmSystem.activate(); } catch (err) { /* not on webOS */ }
  const params = Object.assign({}, launchParams(), (e && e.detail) || {});
  reset();
  load().then(() => { if (params.open === 'inputs') openInputs(); });
  setTimeout(() => api('home/ver').then(v => showNotice(v.notice)).catch(() => {}), 600);
});
load().then(reset);
</script>

  #doorPanel .live i { width: 7px; height: 7px; border-radius: 50%; background: #e0707a; }

  <div class="hd">
    <div class="bell"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3.4C8.4 3.4 6.6 6.2 6.6 10v5.4L4.6 17.6h14.8l-2-2.2V10c0-3.8-1.8-6.6-5.4-6.6z"/><circle cx="12" cy="19.6" r="1.9"/><circle cx="12" cy="2.9" r="1.1"/></svg></div>
    <div class="nm"><div class="t1" id="doorTitle"></div><div class="t2" id="doorCam"></div></div>
    <div class="rt"><div class="tm" id="doorTime"></div><div class="live" id="doorLive"><i></i>LIVE</div></div>
  </div>
  <div class="pic"><img id="doorImg" alt=""><div class="none" id="doorNoPic">No picture (no Protect API key set)</div></div>
</div>
<script>
// Doorbell: ask the server every 1.5 s (loopback); while active, refresh the snapshot about once a second.
(() => {
  const panel = document.getElementById('doorPanel'), img = document.getElementById('doorImg'), live = document.getElementById('doorLive');
  let shown = null, snapTimer = null;
  const fmt = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const refresh = () => { const n = new Image(); n.onload = () => { img.src = n.src; live.style.visibility = 'visible'; }; n.src = '/api/home/doorsnap?t=' + Date.now(); };
  const hide = () => { panel.style.display = 'none'; clearInterval(snapTimer); };
  setInterval(() => {
    if (document.hidden) return;
    fetch('/api/home/door').then(r => r.json()).then(s => {
      if (s && s.until) document.getElementById('doorCam').textContent = s.camera || '';
      if (s && s.until && s.at !== shown) {
        shown = s.at;
        document.getElementById('doorTitle').textContent = s.label;
        document.getElementById('doorTime').textContent = fmt(s.at);
        document.getElementById('doorNoPic').style.display = s.snap ? 'none' : 'flex';
        live.style.visibility = 'hidden';
        img.removeAttribute('src');
        panel.style.display = 'block';
        clearInterval(snapTimer);
        if (s.snap) { refresh(); snapTimer = setInterval(refresh, 1000); }
      } else if ((!s || !s.until) && shown) { shown = null; hide(); }
    }).catch(() => {});
  }, 1500);
  document.addEventListener('keydown', () => { if (shown && panel.style.display !== 'none') hide(); }, true);
})();
</script>
